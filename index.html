<!doctype html><html lang=tr><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ELİTE KURYE • Operasyon</title>
<style>
:root{--bg:#08090c;--panel:#11141a;--line:#272c34;--red:#e61e2b;--text:#f5f7fa;--muted:#9098a5;--green:#24c27a;--yellow:#f5b942}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial}.side{position:fixed;left:0;top:0;bottom:0;width:240px;background:#06070a;border-right:1px solid var(--line);padding:22px 16px}.logo{font-weight:900;font-size:21px;letter-spacing:.5px}.logo span{color:var(--red)}.nav{margin-top:25px}.nav button{width:100%;text-align:left;background:none;border:0;color:#aeb5bf;padding:12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--red);color:white}.main{margin-left:240px;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.label{color:var(--muted);font-size:12px}.value{font-size:26px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.view{display:none}.view.active{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:11px}.btn{border:0;background:var(--red);color:#fff;padding:9px 13px;border-radius:8px;font-weight:700}.btn.gray{background:#30343b}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.input{background:#090a0d;color:white;border:1px solid var(--line);border-radius:8px;padding:10px}.wide{grid-column:1/-1}.login{min-height:100vh;display:grid;place-items:center}.login .panel{width:380px}.map{min-height:400px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.courier{padding:14px;border:1px solid var(--line);border-radius:10px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center}.modal .panel{width:min(600px,92vw)}@media(max-width:900px){.side{width:190px}.main{margin-left:190px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}} 
</style>
<div id=login class=login><div class=panel><div class=logo>ELİTE <span>KURYE</span></div><p style=color:var(--muted)>Operasyon paneli</p><form class=form style=grid-template-columns:1fr onsubmit=login(event)><input class=input id=phone placeholder="Telefon" value="05000000000"><input class=input id=password type=password placeholder="Şifre" value="Elite123!"><button class=btn>Giriş</button></form><p id=err class=red></p></div></div>
<div id=app style=display:none><aside class=side><div class=logo>ELİTE <span>KURYE</span></div><div id=nav class=nav></div><button class="nav button" onclick=logout()>Çıkış</button></aside><main class=main><div class=top><div><h1 id=title style=margin:0>Dashboard</h1><span class=label>Bursa • Gemlik Operasyon</span></div><span id=connection class=pill>● Bağlanıyor</span></div>
<section id=dashboard class="view active"><div id=stats class=grid></div><div class=panel style=margin-top:14px><h3>Son siparişler</h3><div id=recent></div></div></section>
<section id=orders class=view><div class=panel><div class=top><h2>Siparişler</h2><button class=btn onclick=showOrder()>+ Yeni Sipariş</button></div><table class=table><thead><tr><th>No</th><th>Restoran</th><th>Müşteri</th><th>Mesafe</th><th>Paket</th><th>Restoran</th><th>Kurye</th><th>Durum</th><th></th></tr></thead><tbody id=ordersBody></tbody></table></div></section>
<section id=live class=view><div class=panel><h2>Canlı Kuryeler</h2><div id=liveMap class=map></div></div></section>
<section id=finance class=view><div id=finStats class=grid></div><div class=panel style=margin-top:14px><h2>Gider Ekle</h2><form class=form onsubmit=expense(event)><input class=input id=ed placeholder="Açıklama" required><input class=input id=ea type=number step=.01 placeholder="Tutar TL" required><input class=input id=ec placeholder="Kategori" required><button class=btn>Ekle</button></form></div></section>
<section id=reports class=view><div class=panel><h2>Günlük Rapor</h2><table class=table><thead><tr><th>Tarih</th><th>Sipariş</th><th>Ciro</th><th>Kurye</th><th>Brüt</th></tr></thead><tbody id=repBody></tbody></table></div></section>
<section id=people class=view><div class=panel><h2>Kullanıcı Oluştur</h2><form class=form onsubmit=person(event)><select class=input id=prole><option>COURIER</option><option>RESTAURANT</option><option>ADMIN</option></select><input class=input id=pname placeholder="Ad Soyad" required><input class=input id=pphone placeholder="Telefon" required><input class=input id=ppass placeholder="Şifre" required><input class=input id=rate type=number value=65 placeholder="Kurye TL/paket"><select class=input id=motor><option value=OWN>Kendi Motoru</option><option value=COMPANY>Şirket Motoru</option></select><button class=btn>Oluştur</button></form></div></section>
</main></div>
<div id=modal class=modal><div class=panel><h2>Yeni Sipariş</h2><form class=form onsubmit=order(event)><select class=input id=restaurant></select><input class=input id=customer placeholder="Müşteri adı" required><input class=input id=address placeholder="Teslimat adresi" required><input class=input id=distance type=number step=.1 placeholder="Mesafe km" required><input class=input id=packages type=number min=1 value=1 placeholder="Paket" required><button class=btn>Kaydet</button><button type=button class="btn gray" onclick=closeModal()>Vazgeç</button></form></div></div>
<script>
const API=localStorage.elite_api||location.origin;let token=localStorage.elite_token,me;
const $=x=>document.getElementById(x);async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(API+p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'İşlem başarısız');return j}
async function login(e){e.preventDefault();try{let j=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value,password:$('password').value})});token=j.token;me=j.user;localStorage.elite_token=token;start()}catch(x){$('err').textContent=x.message}}
function start(){$('login').style.display='none';$('app').style.display='block';let items=[['dashboard','Dashboard'],['orders','Siparişler'],['live','Canlı Kuryeler'],['finance','Finans'],['reports','Raporlar'],['people','Kullanıcılar']];$('nav').innerHTML=items.map(x=>`<button data-v=${x[0]}>${x[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));load();ws()}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');$('title').textContent=document.querySelector(`[data-v=${v}]`)?.textContent||v;load()}
function logout(){localStorage.removeItem('elite_token');location.reload()}
async function load(){try{let d=await api('/dashboard'),f=await api('/finance/summary'),o=await api('/orders'),c=await api('/couriers/live'),r=await api('/reports/summary');$('stats').innerHTML=[['Toplam',d.orders],['Bekleyen',d.waiting],['Aktif',d.active],['Teslim',d.delivered],['Ciro',(+d.revenue/100).toFixed(2)+' TL'],['Kurye',(+d.courier_cost/100).toFixed(2)+' TL'],['Brüt',(+d.gross/100).toFixed(2)+' TL'],['Net',((+f.net)/100).toFixed(2)+' TL']].map(x=>`<div class=card><div class=label>${x[0]}</div><div class=value>${x[1]}</div></div>`).join('');$('ordersBody').innerHTML=o.map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.restaurant_name}</td><td>${x.customer_name}</td><td>${x.distance_km} km</td><td>${x.package_count}</td><td>${(+x.restaurant_fee_kurus/100).toFixed(2)} TL</td><td>${x.courier_name||'-'}</td><td>${x.status}</td><td>${x.status==='WAITING'?`<button class=btn onclick=assign('${x.id}')>Ata</button>`:''}</td></tr>`).join('');$('recent').innerHTML=o.slice(0,8).map(x=>`<p>#${x.id.slice(0,8)} • ${x.restaurant_name} • ${x.customer_name} • ${x.status}</p>`).join('');$('liveMap').innerHTML=c.map(x=>`<div class=courier><b>${x.full_name}</b><br>${x.motor_type==='OWN'?'Kendi':'Şirket'} motor<br><span class=label>${x.latitude}, ${x.longitude}</span><br>${x.is_available?'🟢 Müsait':'🔴 Meşgul'}</div>`).join('')||'<span class=label>Konum gönderen kurye yok</span>';$('repBody').innerHTML=r.map(x=>`<tr><td>${x.day}</td><td>${x.orders}</td><td>${+x.revenue/100} TL</td><td>${+x.courier_cost/100} TL</td><td>${+x.gross/100} TL</td></tr>`).join('');$('finStats').innerHTML=[['Ciro',+f.revenue/100],['Kurye Hakedişi',+f.courier/100],['Brüt',+f.gross/100],['Gider',+f.expenses/100],['Net',+f.net/100]].map(x=>`<div class=card><div class=label>${x[0]}</div><div class=value>${(+x[1]).toFixed(2)} TL</div></div>`).join('')}catch(e){console.error(e)}}
async function assign(id){let cs=await api('/couriers');let n=prompt(cs.map((x,i)=>`${i+1}. ${x.full_name} — ${x.rate_kurus/100} TL/paket`).join('\\n')+'\\nSeç:');let c=cs[+n-1];if(c){await api('/orders/'+id+'/assign',{method:'POST',body:JSON.stringify({courierId:c.id})});load()}}
async function order(e){e.preventDefault();try{await api('/orders',{method:'POST',body:JSON.stringify({restaurantId:$('restaurant').value,customerName:$('customer').value,deliveryAddress:$('address').value,distanceKm:+$('distance').value,packageCount:+$('packages').value})});closeModal();load()}catch(x){alert(x.message)}}
async function expense(e){e.preventDefault();await api('/expenses',{method:'POST',body:JSON.stringify({description:$('ed').value,amountKurus:Math.round(+$('ea').value*100),category:$('ec').value})});e.target.reset();load()}
async function person(e){e.preventDefault();await api('/users',{method:'POST',body:JSON.stringify({role:$('prole').value,fullName:$('pname').value,phone:$('pphone').value,password:$('ppass').value,motorType:$('motor').value,rateKurus:Math.round(+$('rate').value*100)})});alert('Kullanıcı oluşturuldu');e.target.reset()}
async function showOrder(){let r=await api('/restaurants');$('restaurant').innerHTML=r.map(x=>`<option value=${x.id}>${x.name}</option>`).join('');$('modal').style.display='grid'}function closeModal(){$('modal').style.display='none'}
function ws(){try{let w=new WebSocket(API.replace(/^http/,'ws'));w.onopen=()=>$('connection').textContent='● Canlı';w.onclose=()=>$('connection').textContent='● Bağlantı yok';w.onmessage=()=>load()}catch(e){}}
if(token){try{me=JSON.parse(atob(token.split('.')[1]));start()}catch(e){localStorage.removeItem('elite_token')}}
</script></html>
